<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plainte Citoyenne - Plateforme de Gestion des Plaintes</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Redirection automatique vers la page de connexion
        window.location.href = 'login.html';
    </script>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                📋 Plainte Citoyenne
            </div>
        </div>
    </header>

    <main class="container auth-page">
        <div class="card auth-card">
            <h1 class="text-center">Bienvenue</h1>

            <p class="text-center">Accédez facilement à votre espace pour soumettre et suivre vos plaintes.</p>
            
            <div class="actions mt-4">
                <a class="btn full-width" href="login.html">
                    🔐 Connexion
                </a>
                <a class="btn secondary full-width" href="register.html">
                    ✍️ Créer un compte
                </a>
            </div>

            <div class="mt-4 text-center" style="padding-top: 24px; border-top: 1px solid var(--border);">
                <p class="text-muted" style="margin-bottom: 12px;">Besoin d'aide ?</p>
                <a href="contact.html" class="text-muted">Nous contacter</a>
            </div>
        </div>

</html>
