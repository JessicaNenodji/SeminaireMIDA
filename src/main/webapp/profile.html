<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Plainte Citoyenne</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">📋 Plainte Citoyenne</div>
            <nav>
                <a href="home.html">Accueil</a>
                <a href="complaints.html">Mes plaintes</a>
                <a href="profile.html">Profil</a>
            </nav>
            <div class="user-menu">
                <span class="text-muted">Menu</span>
                <a href="logout">Déconnexion</a>
            </div>
        </div>
    </header>

    <main class="container full-height">
        <div class="content-wrapper" style="max-width: 700px;">
            <div class="card">
                <h1>👤 Mon Profil</h1>
                <p class="subtitle">Gérez vos informations personnelles</p>

                <div class="section mt-4">
                    <h2>Informations Personnelles</h2>
                    <form method="post" action="profile-update">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstname">Prénom</label>
                                <input id="firstname" name="firstname" type="text" value="Jean" placeholder="Votre prénom">
                            </div>
                            <div class="form-group">
                                <label for="lastname">Nom</label>
                                <input id="lastname" name="lastname" type="text" value="Dupont" placeholder="Votre nom">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">Adresse e-mail</label>
                            <input id="email" name="email" type="email" value="jean.dupont@email.com" placeholder="Votre e-mail">
                        </div>

                        <div class="form-group">
                            <label for="phone">Numéro de téléphone</label>
                            <input id="phone" name="phone" type="tel" placeholder="+33 6 XX XX XX XX">
                        </div>

                        <div class="form-group">
                            <label for="address">Adresse</label>
                            <input id="address" name="address" type="text" placeholder="Votre adresse complète">
                        </div>

                        <div class="actions horizontal mt-4">
                            <button type="submit" class="btn">Enregistrer</button>
                            <a href="home.html" class="btn secondary">Annuler</a>
                        </div>
                    </form>
                </div>

                <div class="section mt-4" style="padding-top: 24px; border-top: 1px solid var(--border);">
                    <h2>Sécurité</h2>
                    <p class="text-muted">Gérez vos paramètres de sécurité</p>
                    <a href="#" class="btn secondary mb-2">Changer le mot de passe</a>
                </div>

                <div class="section mt-4" style="padding-top: 24px; border-top: 1px solid var(--border);">
                    <h2>Préférences</h2>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" checked> Recevoir les notifications par e-mail
                        </label>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" checked> Recevoir les mises à jour
                        </label>
                    </div>
                </div>

                <div id="feedback" class="mt-3"></div>
            </div>
        </div>
    </main>
</body>
</html>
