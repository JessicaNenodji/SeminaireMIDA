<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Plainte Citoyenne</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                📋 Plainte Citoyenne
            </div>
        </div>
    </header>

    <main class="container auth-page">
        <div class="card auth-card">
            <h1>Connexion</h1>
            <p class="subtitle">Entrez vos identifiants pour accéder à votre compte.</p>
            
            <form method="post" action="login">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input id="username" name="username" type="text" required placeholder="Entrez votre nom d'utilisateur">
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input id="password" name="password" type="password" required placeholder="Entrez votre mot de passe">
                </div>

                <button type="submit" class="btn full-width">Se connecter</button>
            </form>

            <div id="feedback" class="mt-3"></div>

            <div class="mt-4 text-center" style="padding-top: 20px; border-top: 1px solid var(--border);">
                <p class="text-muted">Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
            </div>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const success = params.get('success');
        const feedback = document.getElementById('feedback');
        if (error) {
            feedback.innerHTML = `<div class="alert error">${decodeURIComponent(error)}</div>`;
        }
        if (success) {
            feedback.innerHTML = `<div class="alert success">${decodeURIComponent(success)}</div>`;
        }
    </script>
</body>
</html>
